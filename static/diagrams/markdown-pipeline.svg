<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">Markdown publishing pipeline</title>
  <desc id="desc">A Markdown post passes through Hugo and becomes a published web page.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315d4a"/>
    </marker>
  </defs>
  <rect width="960" height="280" rx="12" fill="#fcfcfa"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="55" y="85" width="220" height="110" rx="8" fill="#eceee8" stroke="#686b64" stroke-width="2"/>
    <text x="165" y="132" font-size="24" fill="#171815">Markdown</text>
    <text x="165" y="164" font-size="16" fill="#686b64">text · math · diagrams</text>
    <rect x="370" y="85" width="220" height="110" rx="8" fill="#e3eee8" stroke="#315d4a" stroke-width="2"/>
    <text x="480" y="151" font-size="28" fill="#171815">Hugo</text>
    <rect x="685" y="85" width="220" height="110" rx="8" fill="#eceee8" stroke="#686b64" stroke-width="2"/>
    <text x="795" y="132" font-size="24" fill="#171815">Web page</text>
    <text x="795" y="164" font-size="16" fill="#686b64">responsive article</text>
  </g>
  <path d="M285 140 H355" fill="none" stroke="#315d4a" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M600 140 H670" fill="none" stroke="#315d4a" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
